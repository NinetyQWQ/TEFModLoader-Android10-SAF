name: Build Release APK

on:
  workflow_dispatch:
  push:
    branches: [ tefmodloader ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platforms;android-36" "platform-tools" "build-tools;36.0.0"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      - name: Rebuild injected dex (Bypass.zip)
        run: |
          chmod +x scripts/rebuild_inject_dex.sh
          ./scripts/rebuild_inject_dex.sh
      - name: Build release APK
        run: ./gradlew :composeApp:assembleRelease --no-daemon --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: TEFModLoader-release
          path: |
            composeApp/build/outputs/apk/release/*.apk
          if-no-files-found: error
